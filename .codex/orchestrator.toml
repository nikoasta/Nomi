role = "orchestrator-stage"
handoff_file = ".codex/handoff.md"
project_index_file = ".codex/project-index.md"
artifact_template = ".codex/stage-artifact-template.md"

[baseline]
profile = "balanced-v2.12"
source_skill = "orchestration-setup"

[workspace]
topology = "single_repo"
multi_repo = false
root = "."

[delegation]
launcher = "codex_subagents"
subagent_visibility = "separate_spawned_threads"
inline_subagents_allowed = false
requires_explicit_user_spawn_request = true
parallel_decomposition_matrix = "required_for_medium_complex"
parallel_execution_default = "spawn_all_independent_streams"
sequential_requires_reason = true
write_heavy_isolation = "dedicated_worktree"

[subagent_model_policy]
default_model = "inherit_orchestrator"
default_reasoning_effort = "inherit_orchestrator"
reasoning_policy = "complexity_based"
model_override_requires_current_user_authorization = true
record_model_reasoning_rationale = true
high_reasoning_triggers = [
  "architecture",
  "security",
  "data_migration",
  "cross_module_change",
  "critical_bug",
  "review",
  "ambiguous_requirements",
]

[verification]
process_only_commands = ["scripts/orchestration/run_process_verification.sh"]
documentation_change_commands = [
  "scripts/orchestration/run_process_verification.sh",
  "git diff --check",
]
code_change_commands = ["pnpm run gates"]
e2e_commands = ["pnpm run test:e2e"]
stage_close_commands = [
  "scripts/orchestration/run_process_verification.sh",
  "pnpm run gates",
]

[enforcement]
process_verification_entrypoint = "scripts/orchestration/run_process_verification.sh"
task_truth = "beads"

[completion_inbox]
scope = "repo"
events_file = ".codex/completion-inbox/events.jsonl"
review_state_file = ".codex/completion-inbox/review-state.json"
report_entrypoint = "scripts/orchestration/report_child_completion.py"
review_entrypoint = "scripts/orchestration/review_completion_inbox.py"

[handoff]
current_state_max_lines = 120

[project_index]
max_lines = 150
required_sections = [
  "## Runtime Shape",
  "## Primary Entrypoints",
  "## Core Subsystems",
  "## Integrations And Sources Of Truth",
  "## Verification",
  "## Conventions And Boundaries",
]

[delivery]
mode = "mixed"
primary_branch = "everville/media-platform"
push_after_closeout = "ask"
protected_branches = ["main", "pr/higgsfield-integration", "pr/i18n-interface"]

[debt_scan]
enabled = true
